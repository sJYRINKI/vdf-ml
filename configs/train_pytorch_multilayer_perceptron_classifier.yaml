dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/pytorch_multilayer_perceptron_classifier/{model_id}

labels:
  lobe: 0
  other: 1
  o_point: 2
  reconnection: 3

features:
  downsample_factor: 2
  batch_size: 512
  n_jobs: 16
  log_eps: 1e-30

model:
  hidden_layer_sizes: [64]
  activation: relu
  solver: adam
  alpha: 0.05
  batch_size: auto
  learning_rate_init: 0.0005
  max_iter: 1000
  early_stopping: true
  validation_fraction: 0.2
  n_iter_no_change: 10
  tol: 0.0001
  random_state: 1234
  device: auto
  deterministic: false
  prediction_batch_size: 4096
