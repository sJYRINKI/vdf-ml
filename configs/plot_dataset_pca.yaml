dataset_dir: data/train/timesteps_{timestep}
output_dir: data/train/timesteps_{timestep}/pca

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

features:
  downsample_factor: 1
  batch_size: 256
  n_jobs: -1
  log_eps: 1e-30
  sample_normalization: standard
  sample_norm_eps: 1e-6
  cache:
    enabled: false
    dir: data/train/timesteps_{dataset_id}/cache
    filename: autoencoder_xz_log.npy
    metadata_filename: autoencoder_xz_log_metadata.npz
    rebuild: false
    batch_size: 64
    n_jobs: 8

spatial_features:
  distance:
    enabled: true
    weight: 1.0
    columns:
      - distance_to_x_point_re
      - distance_to_o_point_re
  vector:
    enabled: true
    weight: 1.0
    columns:
      - vdf_to_x_point_dx_re
      - vdf_to_x_point_dz_re
      - vdf_to_o_point_dx_re
      - vdf_to_o_point_dz_re

pca:
  backend: torch
  algorithm: lowrank
  n_components: 64
  device: auto
  oversamples: 16
  niter: 2
  random_state: 1234

pca_fit:
  balanced: true
  samples_per_class: min
  #class_names: all
  class_names: [exhaust, dayside, o_point, x_point]
  replace: false
  random_state: 1234

neighbor_metrics:
  enabled: true
  k_neighbors: 25
  batch_size: 16384
  low_purity_thresholds: [0.5, 0.65, 0.8]

filter_preview:
  enabled: true
  candidate_classes: [exhaust, dayside]
  point_neighbor_classes: [x_point, o_point]
  protected_classes: [x_point, o_point]
  apply_splits: [train]
  min_point_neighbor_fraction: 0.5
  min_point_neighbor_fraction_by_class:
    exhaust: 0.4
    dayside: 0.6
  max_same_class_fraction: 0.60
  max_same_class_fraction_by_class: {}

plot:
  enabled: true
  max_points_per_class: 5000
  random_state: 1234
  alpha: 0.6
  point_size: 8

embedding_plot:
  enabled: true
  method: tsne
  splits: [train]
  max_points_per_class: 1000
  random_state: 1234
  perplexity: 30
  n_neighbors: 15
  min_dist: 0.1
