# Autoencoder training configuration. The command separately selects the
# dataset, output directory, and representation (raw or hermite). Physical
# class and topology values never enter the model input. Raw uses every voxel
# in X.npy with model shape (batch, 1, vx, vy, vz); Hermite uses every signed
# coefficient in X_hermite.npy with shape (batch, 1, n1, n2, n3). Both use the
# same Conv3d autoencoder. The latent vector also predicts six masked topology
# targets, and training writes autoencoder.pt, metrics.txt,
# training_history.csv, and reconstruction_examples.png.

random_state: 1234
# Device choices are auto, cpu, cuda, or cuda:N. auto selects the current
# CUDA/ROCm accelerator when PyTorch exposes one and otherwise selects CPU;
# cuda:N selects visible accelerator index N.
device: auto

# Number of visible CUDA devices used for consecutive Conv3d model stages in
# one Python process. 1 keeps all stages on one selected device. Larger values
# distribute encoder, bottleneck, decoder, reconstruction, and topology stages
# without model replication or data-parallel training.
model_parallel_gpus: 1

# Raw-only preprocessing applied voxelwise to the complete physical VDF before
# training-derived per-voxel normalization; Hermite coefficients skip it.
raw:
  # Positive physical VDF floor in s^3 m^-6. Nonpositive raw values are
  # replaced by this value before log10, preventing undefined logarithms.
  log_eps: 1.0e-30

# One Conv3d encoder, bottleneck, decoder, and deterministic shared latent
# vector for complete raw and Hermite volumes.
model:
  # Ordered Conv3d encoder widths. The decoder reverses these widths for both
  # complete raw and complete Hermite inputs.
  channels: [8, 16, 32]
  # Maximum spatial cells retained after encoding along the three saved model
  # axes. The effective shape is capped by the encoded volume on each axis.
  # Smaller values reduce dense bottleneck parameters and memory use.
  bottleneck_shape: [10, 10, 10]
  # Size of the shared reconstruction/topology latent vector.
  latent_size: 64
  # Pooling choice; average is the only supported option and halves every
  # spatial axis that is still large enough for another reduction.
  pooling: average

# Auxiliary targets in fixed project order: X distance, O distance, X dx,
# X dz, O dx, and O dz, all in Earth radii. Finite training values alone fit
# scaling; missing values are independently masked and remain reconstruction
# samples. Topology values are supervised targets, never model inputs.
topology:
  # Hidden width of the small latent-space topology head.
  hidden_size: 64
  # Weight applied to globally masked Smooth L1 in
  # total_loss = reconstruction_mse + loss_weight * topology_smooth_l1.
  loss_weight: 0.1

# Chronological complete-timestep partitioning. Two boundary gaps are
# excluded first; fractions then assign leading usable timesteps to train
# and validation, with every remaining usable timestep assigned to test.
split:
  # Float fraction from 0 to 1 of usable unique timesteps assigned to model
  # fitting. It combines with validation_fraction, leaving the remainder
  # for the test partition.
  train_fraction: 0.6
  # Float fraction from 0 to 1 of usable unique timesteps assigned to epoch
  # selection. train_fraction + validation_fraction must leave test data.
  validation_fraction: 0.2
  # Nonnegative integer count of unique timesteps omitted at each of the
  # train-validation and validation-test boundaries to reduce leakage.
  gap_timesteps: 1

# On-demand memory-mapped sample loading and bounded float64 normalization.
# Batch and worker choices trade throughput against accelerator and host memory.
data_loader:
  # Positive integer samples per optimizer update; larger batches may improve
  # throughput but increase activation and accelerator memory use.
  batch_size: 1
  # Number of DataLoader worker processes used only for loading and
  # preprocessing samples. This does not distribute model training.
  num_workers: 0
  # Positive integer samples per float64 normalization-statistics batch;
  # smaller values reduce peak host memory without changing the statistics.
  normalization_batch_size: 1
  # Choices are true, false, or auto. true pins loader tensors in host memory,
  # false disables pinning, and auto pins only for CUDA/ROCm execution.
  pin_memory: auto

# One AdamW optimizer owns every encoder, bottleneck, decoder, reconstruction,
# and topology-head parameter across all occupied model-stage devices.
optimizer:
  # Positive float AdamW step size; larger values make faster but potentially
  # less stable parameter updates.
  learning_rate: 1.0e-3
  # Nonnegative float decoupled AdamW weight-decay coefficient; 0 disables
  # parameter shrinkage and larger values regularize weights more strongly.
  weight_decay: 1.0e-4
  # Exactly two floats from 0 to below 1: exponential decay factors for the
  # AdamW first-moment and second-moment estimates, respectively.
  betas: [0.9, 0.999]
  # Positive float added to the AdamW denominator for numerical stability;
  # it does not alter the reconstruction-loss definition.
  epsilon: 1.0e-8

# Training duration and early stopping. Validation total loss, including the
# configured masked topology term, selects the best checkpoint.
training:
  # Positive integer maximum number of complete training epochs.
  max_epochs: 50
  # Positive integer consecutive epochs without a sufficient validation
  # total-loss decrease before training stops early.
  patience: 10
  # Nonnegative float minimum validation total-loss decrease that counts as
  # an improvement and resets the patience counter.
  min_delta: 1.0e-6

# reconstruction_examples.png contains deterministic original,
# reconstruction, and absolute-error panels from the best selected model.
# Raw panels use the extraction physical VDF style and one logarithmic scale;
# Hermite panels retain the signed coefficient visualization and white axes;
# labels follow the saved unrotated or rotated coefficient-axis order.
plot:
  # Positive integer maximum examples retained for each physical class in
  # each of train, validation, and test within the combined figure.
  max_per_class: 3
  # Positive integer PNG resolution in dots per inch; increasing it improves
  # raster detail while increasing rendering time and output-file size.
  dpi: 150
