file_template_bulk: /wrk-vakka/group/spacephysics/vlasiator/2D/BCH/bulk/bulk.000{timestep:04d}.vlsv
file_template_flux: /wrk-vakka/group/spacephysics/vlasiator/2D/BCH/flux/bulk.000{timestep:04d}.bin

output_dirs:
  train: data/train
  test: data/test

labels:
  lobe: 0
  other: 1
  o_point: 2
  reconnection: 3

creation:
  planning_n_jobs: 24
  extraction_n_jobs: 8

points:
  x_class_name: reconnection
  o_class_name: o_point
  region_re:
    x_between: [-30.0, -10.0]
    z_abs_max: 1.0
  x_selection:
    #method: physical
    method: manual
    density_variable: rho
    half_width_di:
      eigenvector_0: 2.0
      eigenvector_1: 2.0
    y_half_width_re: 0.0
    manual_re:
      x_half_width_re: 0.5
      y_half_width_re: 0.0
      z_half_width_re: 0.3
  o_selection:
    #method: physical
    method: manual
    core_fraction: 0.8
    y_half_width_re: 0.0
    manual_re:
      x_half_width_re: 0.5
      y_half_width_re: 0.0
      z_half_width_re: 0.3

class_coords_re:
  lobe:
    - [-12, 0, 8]
    - [-12, 0, -8]