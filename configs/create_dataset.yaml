file_template_bulk: /wrk-vakka/group/spacephysics/vlasiator/2D/BCH/bulk/bulk.000{timestep:04d}.vlsv
file_template_flux: /wrk-vakka/group/spacephysics/vlasiator/2D/BCH/flux/bulk.000{timestep:04d}.bin

output_dirs:
  train: data/train
  test: data/test

labels:
  reconnection: 1
  lobe: 0
  other: -1

creation:
  n_jobs: 16

vdf_neighborhood:
  enabled: true
  max_index_steps: 200
  x_ranks: [1, 2]
  z_ranks: [1]

flux_points:
  x_class_name: reconnection
  o_class_name: other
  region_re:
    x_between: [-20.0, -5.0]
    z_abs_max: 1.0

class_coords_re:
  lobe:
    - [-12, 0, 8]
    - [-12, 0, -8]