dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/pytorch_convolutional_neural_network_classifier/{model_id}

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

labels:
  lobe: 0
  other: 1
  o_point: 2
  reconnection: 3

features:
  downsample_factor: 1
  batch_size: 512
  n_jobs: -1
  log_eps: 1e-30

model:
  channels: [16, 32, 64]
  classifier_size: 64
  dropout: 0.3
  class_weight: sqrt_balanced
  #class_weight: none
  #class_weight: balanced
  weight_decay: 0.0001
  batch_size: 256
  learning_rate: 0.0003
  max_epochs: 300
  early_stopping: true
  patience: 15
  tolerance: 0.0001
  random_state: 1234
  device: auto
  deterministic: false
  prediction_batch_size: 512

failure_plots:
  enabled: true
  splits: [validation, test]
  max_per_pair: 8
  vdflim: 2000000.0
