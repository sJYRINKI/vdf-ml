dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/pytorch_convolutional_neural_network_classifier/{model_id}

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

labels:
  lobe: 0
  exhaust: 1
  o_point: 2
  reconnection: 3
  dayside: 4

features:
  downsample_factor: 1
  batch_size: 512
  n_jobs: -1
  log_eps: 1e-30
  cache:
    enabled: true
    dir: data/train/timesteps_{dataset_id}/cache
    filename: autoencoder_xz_log.npy
    metadata_filename: autoencoder_xz_log_metadata.npz
    rebuild: false
    batch_size: 64
    n_jobs: 8

training_filter:
  enabled: true
  source: pca
  dry_run: false
  candidate_classes: [exhaust, dayside]
  point_neighbor_classes: [reconnection, o_point]
  protected_classes: [reconnection, o_point]
  max_removed_fraction_per_class: 0.3
  cnn_embedding_knn:
    run_source_model: true
  pca:
    features:
      downsample_factor: 1
      batch_size: 64
      n_jobs: 8
      log_eps: 1e-30
      sample_normalization: standard
      sample_norm_eps: 1e-6
      cache:
        enabled: true
        dir: data/train/timesteps_{dataset_id}/cache
        filename: autoencoder_xz_log.npy
        metadata_filename: autoencoder_xz_log_metadata.npz
        rebuild: false
        batch_size: 64
        n_jobs: 8
    pca:
      backend: torch
      algorithm: lowrank
      n_components: 64
      device: auto
      oversamples: 16
      niter: 2
      random_state: 1234
    pca_fit:
      balanced: true
      samples_per_class: min
      class_names: [exhaust, dayside, o_point, reconnection]
      replace: false
      random_state: 1234
    neighbor_metrics:
      enabled: true
      k_neighbors: 25
      batch_size: 16384
      low_purity_thresholds: [0.5, 0.65, 0.8]
    filter_preview:
      enabled: true
      min_point_neighbor_fraction: 0.5
      min_point_neighbor_fraction_by_class:
        exhaust: 0.4
        dayside: 0.6
      max_same_class_fraction: 0.60
      max_same_class_fraction_by_class: {}
    plot:
      enabled: false
      max_points_per_class: 5000
      random_state: 1234
      alpha: 0.6
      point_size: 8
    embedding_plot:
      enabled: false
      method: tsne
      splits: [train]
      max_points_per_class: 1000
      random_state: 1234
      perplexity: 30
      n_neighbors: 15
      min_dist: 0.1

cnn_embedding_knn:
  enabled: false
  k_neighbors: 25
  embedding_batch_size: 512
  neighbor_batch_size: 4096
  candidate_classes: [exhaust, dayside]
  point_neighbor_classes: [reconnection, o_point]
  protected_classes: [reconnection, o_point]
  apply_splits: [train]
  min_point_neighbor_fraction: 0.5
  min_point_neighbor_fraction_by_class:
    exhaust: 0.4
    dayside: 0.6
  max_same_class_fraction: 0.60
  max_same_class_fraction_by_class: {}
  plot:
    enabled: true
    max_points_per_class: 5000
    random_state: 1234
    alpha: 0.6
    point_size: 8

model:
  channels: [16, 32, 64]
  adaptive_pool_shape: [4, 4]
  classifier_size: 64
  dropout: 0.2
  #class_weight: sqrt_balanced
  class_weight: none
  #class_weight: balanced
  weight_decay: 0.0001
  batch_size: 256
  learning_rate: 0.0003
  max_epochs: 300
  early_stopping: true
  patience: 15
  tolerance: 0.0001
  random_state: 1234
  device: auto
  deterministic: false
  prediction_batch_size: 512

failure_plots:
  enabled: true
  splits: [validation, test]
  max_per_pair: 8
  vdflim: 2000000.0
