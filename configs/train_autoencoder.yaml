dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/autoencoder/{model_id}

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

input:
  slice: xz
  orientation: plot
  log_eps: 1e-30
  clip_negative_to_zero: true
  normalization: train_global_standard

model:
  channels: [16, 32, 64, 128]
  latent_dim: 2048
  encoder_pooling: average
  encoder_adaptive_pool_shape: null

loss:
  high_signal_loss_weight: 0.25
  high_signal_quantile: 0.98
  mass_loss_weight: 0.0
  peak_loss_weight: 0.001

cache:
  enabled: true
  dir: data/train/timesteps_{dataset_id}/cache
  filename: autoencoder_xz_log.npy
  metadata_filename: autoencoder_xz_log_metadata.npz
  rebuild: false
  batch_size: 128
  n_jobs: 16

training:
  batch_size: 256
  normalization_batch_size: 512
  num_workers: 16
  persistent_workers: true
  prefetch_factor: 2
  multi_gpu: true
  device_ids: all
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 400
  early_stopping: true
  patience: 20
  tolerance: 0.00001
  random_state: 1234
  device: auto
  deterministic: false

plot:
  enabled: true
  splits: [train, validation, test]
  max_per_class: 3
  vdflim: 2000000.0
