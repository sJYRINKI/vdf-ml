dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/logistic_regression/{model_id}

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

features:
  downsample_factor: 8
  batch_size: 512
  n_jobs: 4

model:
  max_iter: 1000
  penalty: l2
  solver: lbfgs
  C: 1.0
